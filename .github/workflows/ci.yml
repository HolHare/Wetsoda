name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Workflows & Credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow JSON
        run: |
          find workflows/ -name "*.json" | while read f; do
            echo "Checking $f..."
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All workflow files valid."

      - name: Validate credential JSON
        run: |
          find credentials/ -name "*.json" | while read f; do
            echo "Checking $f..."
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All credential files valid."

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/holhare/wetsoda:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i 's/n8n_secret_change_me/ci_smoke_password/' .env
          sed -i 's/change_this_32char_key_in_prod__/ci_smoke_key_32chars_placeholder/' .env

      - name: Build image for test
        run: docker compose build n8n

      - name: Start postgres + n8n (skip Ollama)
        run: docker compose up -d postgres n8n

      - name: Wait for n8n health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:5678/healthz > /dev/null; then
              echo "n8n healthy after $((i * 5))s"
              exit 0
            fi
            echo "  waiting... ($i/36)"
            sleep 5
          done
          echo "ERROR: n8n did not become healthy"
          docker compose logs n8n
          exit 1

      - name: Verify API response
        run: curl -sf http://localhost:5678/healthz

      - name: Cleanup
        if: always()
        run: docker compose down -v
