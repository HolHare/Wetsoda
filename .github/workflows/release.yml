name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: holhare/wetsoda

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Post-release Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i 's/n8n_secret_change_me/release_smoke_pass/' .env
          sed -i 's/change_this_32char_key_in_prod__/release_smoke_key_32chars_00000/' .env

      - name: Pull and start stack
        run: |
          docker compose pull n8n
          docker compose up -d postgres n8n

      - name: Wait for health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:5678/healthz > /dev/null; then
              echo "Healthy after $((i * 5))s"
              exit 0
            fi
            echo "  waiting... ($i/36)"
            sleep 5
          done
          docker compose logs n8n
          exit 1

      - name: Verify healthcheck
        run: curl -sf http://localhost:5678/healthz

      - name: Cleanup
        if: always()
        run: docker compose down -v
